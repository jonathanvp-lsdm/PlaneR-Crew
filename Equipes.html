<div class="container-fluid">

    <div class="page-title">

        <h2>
            👥 Équipes

            Gestion des équipes du festival
        </p>

    </div>

    <div

        class="row g-4">
    </div>

    <!-- ==========================================
         MODAL EQUIPE
    ========================================== -->

    <div
        class="modal fade"
        id="equipeModal"
        tabindex="-1">

        <div class="modal-dialog modal-xl">

            <div class="modal-content">

                <div class="modal-header">

                    <h4 id="equipeTitre">
                        Équipe
                    </h4>

                    <button

                    </button>

                </div>

                <div class="modal-body">

                    <div id="equipeContenu">

                    </div>

                </div>

            </div>

<!-- ==========================================
     MODAL REAFFECTATION
========================================== -->

<div
    class="modal fade"
    id="reaffectationModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-warning">

                <h5
                     id="reaffectationTitre"
                    class="modal-title">

                    🔄 Réaffectation d'un bénévole

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div
                class="modal-body">

                <div
                    id="reaffectationTexte">

                </div>

            </div>

            <div
                class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                </button>

                <button
                    id="btnConfirmerReaffectation"
                    class="btn btn-warning">

                    🔄 Réaffecter

                </button>

            </div>
